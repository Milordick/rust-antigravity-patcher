name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 - static musl binary (universal across all distros)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            output: agyptch-linux-x86_64
            use_cross: false
            install_musl: true

          # Linux ARM64 (aarch64) - fully static-pie musl binary for Linux
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            output: agyptch-linux-arm64
            use_cross: true

          # Android ARM64 (aarch64) - native Android Bionic binary for Termux
          - os: ubuntu-latest
            target: aarch64-linux-android
            output: agyptch-android-arm64
            use_cross: true

          # macOS (Apple Silicon + Intel on a single runner to avoid queue bottlenecks)
          - os: macos-latest
            target: aarch64-apple-darwin
            output: agyptch-macos-arm64
            use_cross: false
            extra_target: x86_64-apple-darwin
            extra_output: agyptch-macos-x86_64

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            output: agyptch-windows-x86_64.exe
            use_cross: false

          # Windows ARM64 (Surface / Snapdragon X)
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            output: agyptch-windows-arm64.exe
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}${{ matrix.extra_target && format(',{0}', matrix.extra_target) || '' }}

      - name: Install musl-tools (for Linux x86_64)
        if: matrix.install_musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (if needed)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cd rust && cross build --release --target ${{ matrix.target }}
          else
            cd rust && cargo build --release --target ${{ matrix.target }}
            if [ -n "${{ matrix.extra_target }}" ]; then
              cargo build --release --target ${{ matrix.extra_target }}
            fi
          fi
        shell: bash

      - name: Stage output artifact
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp "rust/target/${{ matrix.target }}/release/agyptch.exe" "dist/${{ matrix.output }}"
          else
            cp "rust/target/${{ matrix.target }}/release/agyptch" "dist/${{ matrix.output }}"
            chmod +x "dist/${{ matrix.output }}"
            if [ -n "${{ matrix.extra_target }}" ]; then
              cp "rust/target/${{ matrix.extra_target }}/release/agyptch" "dist/${{ matrix.extra_output }}"
              chmod +x "dist/${{ matrix.extra_output }}"
            fi
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Prepare Assets
        run: |
          mkdir -p upload
          find release_artifacts -type f -exec cp {} upload/ \;
          # Generate SHA-256 checksums file for supply-chain integrity verification
          (
            cd upload
            sha256sum * > checksums.txt
          )
          cat upload/checksums.txt
          ls -la upload/

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          draft: false
          prerelease: false
          generate_release_notes: false
