name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            output: agyptch-linux-x86_64
            use_cross: false

          # Linux ARM64 (aarch64)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            output: agyptch-linux-arm64
            use_cross: true

          # macOS Apple Silicon (M1/M2/M3/M4)
          - os: macos-latest
            target: aarch64-apple-darwin
            output: agyptch-macos-arm64
            use_cross: false

          # macOS Intel (x86_64)
          - os: macos-latest
            target: x86_64-apple-darwin
            output: agyptch-macos-x86_64
            use_cross: false

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            output: agyptch-windows-x86_64.exe
            use_cross: false

          # Windows ARM64 (Surface / Snapdragon X)
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            output: agyptch-windows-arm64.exe
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if needed)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cd rust && cross build --release --target ${{ matrix.target }}
          else
            cd rust && cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Stage output artifact
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp "rust/target/${{ matrix.target }}/release/agyptch.exe" "dist/${{ matrix.output }}"
          else
            cp "rust/target/${{ matrix.target }}/release/agyptch" "dist/${{ matrix.output }}"
            chmod +x "dist/${{ matrix.output }}"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Prepare Assets
        run: |
          mkdir -p upload
          find release_artifacts -type f -exec cp {} upload/ \;
          ls -la upload/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          draft: false
          prerelease: false
          generate_release_notes: true
